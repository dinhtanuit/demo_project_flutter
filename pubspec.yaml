name: demo_flutter
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  flutter_svg: ^2.0.7
  google_fonts: ^5.0.0
  get: ^4.6.5        # State management
  dartz: ^0.10.1     # Either/Functional
  equatable: ^2.0.5  # Value equality

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
